spring:
  application:
    name: jobforge
  datasource:
    # Zero-setup default: file-backed H2 so jobs survive a restart. Switch to the "postgres"
    # profile for a multi-node cluster.
    url: jdbc:h2:file:./data/jobforge;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 16
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  h2:
    console:
      enabled: true
      path: /h2
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

jobforge:
  workers: ${JOBFORGE_WORKERS:8}
  poll-interval-ms: ${JOBFORGE_POLL_INTERVAL_MS:500}
  lease-seconds: ${JOBFORGE_LEASE_SECONDS:30}
  reaper-interval-ms: ${JOBFORGE_REAPER_INTERVAL_MS:5000}
  retry-base-delay-ms: ${JOBFORGE_RETRY_BASE_DELAY_MS:1000}
  retry-max-delay-ms: ${JOBFORGE_RETRY_MAX_DELAY_MS:300000}
  default-timeout-ms: ${JOBFORGE_DEFAULT_TIMEOUT_MS:60000}
  default-max-attempts: ${JOBFORGE_DEFAULT_MAX_ATTEMPTS:3}
  node-id: ${JOBFORGE_NODE_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: jobforge

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.manangupta.jobforge: INFO
    org.hibernate.SQL: WARN
