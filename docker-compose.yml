# A two-node JobForge cluster sharing one PostgreSQL database.
#
#   docker compose up --build
#   open http://localhost:8081  and  http://localhost:8082
#
# Submit jobs to either node; both claim from the same queue. Kill one node
# (docker compose kill jobforge-2) while jobs are running and watch the other
# node's reaper reclaim its expired leases.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobforge
      POSTGRES_USER: jobforge
      POSTGRES_PASSWORD: jobforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  jobforge-1:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      JOBFORGE_DB_URL: jdbc:postgresql://postgres:5432/jobforge
      JOBFORGE_NODE_ID: node-1
      JOBFORGE_WORKERS: 8
    ports:
      - "8081:8080"

  jobforge-2:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      JOBFORGE_DB_URL: jdbc:postgresql://postgres:5432/jobforge
      JOBFORGE_NODE_ID: node-2
      JOBFORGE_WORKERS: 8
    ports:
      - "8082:8080"

volumes:
  pgdata:
